<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>cluster-port-forward — tunnel monitor</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bg:#101418; --fg:#d8dee6; --dim:#7b8794; --ok:#3fb96f; --bad:#e5534b; --warn:#d9a03f; --card:#1a2028; --line:#2a323d; }
  * { box-sizing: border-box; }
  body { margin:0; padding:24px; background:var(--bg); color:var(--fg);
         font:14px/1.5 -apple-system, "SF Mono", Menlo, monospace; }
  h1 { font-size:17px; margin:0 0 4px; }
  .sub { color:var(--dim); font-size:12px; margin-bottom:18px; word-break:break-all; }
  .bar { display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; align-items:center; }
  button { background:var(--card); color:var(--fg); border:1px solid var(--line);
           border-radius:6px; padding:5px 10px; font:inherit; cursor:pointer; }
  button:hover { border-color:var(--dim); }
  button.danger { color:var(--bad); }
  input { background:var(--bg); color:var(--fg); border:1px solid var(--line);
          border-radius:6px; padding:5px 8px; font:inherit; width:130px; }
  table { border-collapse:collapse; width:100%; margin-bottom:18px; }
  th, td { text-align:left; padding:6px 10px; border-bottom:1px solid var(--line); white-space:nowrap; }
  th { color:var(--dim); font-weight:normal; font-size:12px; text-transform:uppercase; }
  tr:hover td { background:var(--card); }
  .st-online { color:var(--ok); } .st-offline { color:var(--bad); }
  .st-port-up, .st-starting { color:var(--warn); }
  td.acts button { padding:2px 7px; font-size:12px; }
  #toast { position:fixed; bottom:18px; left:18px; background:var(--card); border:1px solid var(--line);
           border-radius:6px; padding:8px 14px; display:none; max-width:70ch; }
  .err { color:var(--bad); }
  a { color:var(--dim); }
</style>
</head>
<body>
<h1>tunnel monitor</h1>
<div class="sub" id="meta">daemon: connecting…</div>
<div class="bar">
  <input id="inc" placeholder="include spec (optional)">
  <input id="to" placeholder="timeout" value="30s" style="width:70px">
  <button onclick="doUp()">up</button>
  <button onclick="doReload()">reload profile</button>
  <button class="danger" onclick="doDownAll()">down all</button>
  <span id="health" style="margin-left:auto;color:var(--dim)"></span>
</div>
<table id="t">
  <thead><tr><th>slug</th><th>ns</th><th>target/pod</th><th>dir</th><th>local</th>
  <th>remote</th><th>state</th><th>uptime</th><th>rst</th><th>actions</th></tr></thead>
  <tbody id="rows"><tr><td colspan="10">…</td></tr></tbody>
</table>
<div class="sub">Cluster drill-down:
  <input id="dns" placeholder="namespace" style="width:110px">
  <input id="dsvc" placeholder="service/pod" style="width:150px">
  <button onclick="drill()">list pods</button>
  <span id="drillout"></span>
</div>
<div id="toast"></div>
<script>
const $ = id => document.getElementById(id);
function toast(msg, bad) { const t=$("toast"); t.textContent=msg; t.style.display="block";
  t.className = bad ? "err" : ""; clearTimeout(t._h); t._h=setTimeout(()=>t.style.display="none", 4000); }
async function api(method, path, body) {
  const r = await fetch(path, {method, headers:{"Content-Type":"application/json"},
                                body: body ? JSON.stringify(body) : undefined});
  let v = {}; try { v = await r.json(); } catch (e) {}
  return {code:r.status, ok:r.ok, ...v};
}
function dur(s) { s=Math.max(0,s|0);
  const h=(s/3600)|0, m=((s%3600)/60)|0, x=s%60;
  return h? h+"h"+m+"m" : m? m+"m"+x+"s" : x+"s"; }
async function refresh() {
  let v; try { v = await api("GET", "/api/tunnels"); } catch(e) {
    $("meta").textContent = "daemon unreachable — cluster-port-forward daemon start (or daemon install)";
    return; }
  const rows = v.tunnels || [];
  $("meta").textContent = "daemon pid " + (v.daemon_pid||"?") +
    " · profile: " + (v.profile||"—") + " · " + rows.length + " tunnel(s)";
  $("rows").innerHTML = rows.map(r =>
    "<tr><td>"+r.key+"</td><td>"+r.namespace+"</td><td>"+(r.pod? r.pod : r.target)+"</td>" +
    "<td>"+r.direction+"</td><td>"+r.local_port+"</td><td>"+r.remote_port+"</td>" +
    '<td class="st-'+r.state+'">'+r.state+"</td><td>"+dur(r.uptime)+"</td><td>"+r.restarts+"</td>" +
    '<td class="acts">' +
    '<button onclick="doRestart(\''+r.slug+'\')">restart</button> ' +
    '<button onclick="doStop(\''+r.slug+'\')">stop</button> ' +
    '<button onclick="doRepoint('+r.local_port+')">repoint→</button> ' +
    '<button onclick="doSetPort(\''+r.slug+'\','+r.local_port+')">set port</button>' +
    "</td></tr>").join("") ||
    '<tr><td colspan="10" style="color:var(--dim)">no tunnels — press up</td></tr>';
}
async function doUp() {
  const body = {include: $("inc").value ? [$("inc").value] : [], timeout: $("to").value || "30s"};
  const v = await api("POST", "/api/up", body);
  v.ok ? toast("up: all online") : toast("up failed/degraded: " + (v.error||""), true);
  refresh();
}
async function doDownAll() {
  const v = await api("POST", "/api/down", {all:true});
  v.ok ? toast("all tunnels down") : toast("down failed: "+(v.error||""), true);
  refresh();
}
async function doStop(slug) {
  const v = await api("POST", "/api/down", {slug:[slug]});
  v.ok ? toast(slug+" stopped") : toast("stop failed: "+(v.error||""), true);
  refresh();
}
async function doRestart(slug) {
  const v = await api("POST", "/api/restart", {slug});
  v.ok ? toast(slug+" restarting") : toast("restart failed: "+(v.error||""), true);
  setTimeout(refresh, 1500);
}
async function doRepoint(lp) {
  const pod = prompt("pod name to repoint local port "+lp+" at:");
  if (!pod) return;
  const v = await api("POST", "/api/repoint", {local_port:lp, pod});
  v.ok ? toast("repointed "+lp+" → "+pod) : toast("repoint failed: "+(v.error||""), true);
  setTimeout(refresh, 1200);
}
async function doSetPort(slug, cur) {
  const p = prompt("new default_port for '"+slug+"' (persists to the profile yaml):", cur);
  if (!p) return;
  const v = await api("POST", "/api/setport", {slug, port: parseInt(p,10)});
  v.ok ? toast(slug+" default_port → "+p) : toast("set port failed: "+(v.error||""), true);
  setTimeout(refresh, 800);
}
async function drill() {
  const ns = $("dns").value.trim(), svc = $("dsvc").value.trim();
  if (!ns) { toast("namespace required", true); return; }
  const v = await api("GET", "/api/tunnels");
  const rows = (v.tunnels||[]).filter(r => r.namespace===ns && (!svc || (r.pod||r.target).includes(svc)));
  $("drillout").textContent = rows.length
    ? " matching rows: " + rows.map(r=>r.key+"@"+r.local_port).join(", ")
    : " no monitored rows in '"+ns+"'" + (svc ? " matching '"+svc+"'" : "");
}
refresh();
setInterval(refresh, 2000);
</script>
</body>
</html>
